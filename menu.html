<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A235A">
<title>Gustavo Sweet & more - المنيو الرقمي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); color: #fff; min-height: 100vh; padding-bottom: 100px; }
    .header { background: linear-gradient(135deg, #4A235A 0%, #6c3483 100%); padding: 25px 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; }
    .header h1 { color: #F1C40F; font-size: 24px; margin-bottom: 5px; }
    .table-info { background: rgba(241,196,15,0.15); border: 1px solid #F1C40F; border-radius: 8px; padding: 10px; margin: 15px; text-align: center; font-size: 15px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;}
    .connection-status { font-size: 11px; padding: 4px 8px; border-radius: 12px; background: #2ECC71; color: #fff; }
    .connection-status.offline { background: #E74C3C; }
    .category-section { margin: 20px 15px; }
    .category-title { color: #F1C40F; font-size: 18px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #F1C40F; display: flex; align-items: center; gap: 8px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .menu-item { background: #2d2d2d; border: 1px solid #404040; border-radius: 12px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
    .menu-item:active { transform: scale(0.97); }
    .item-img { width: 100%; height: 120px; object-fit: cover; display: block; background: #222; }
    .item-img-placeholder { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: rgba(255,255,255,0.03); }
    .item-details { padding: 12px; }
    .item-name { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
    .item-price { color: #F1C40F; font-size: 16px; font-weight: bold; }
    .item-extras { font-size: 11px; color: #999; margin-top: 8px; padding-top: 8px; border-top: 1px solid #404040; }
    .extra-tag { display: inline-block; background: rgba(241,196,15,0.1); color: #F1C40F; padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 10px; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #2ECC71 0%, #27ae60 100%); padding: 15px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.4); display: none; z-index: 200; }
    .cart-bar.show { display: block; }
    .cart-content { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .cart-total { color: #fff; font-size: 20px; font-weight: bold; }
    .cart-btn { background: #fff; color: #27ae60; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: flex-end; }
    .modal.show { display: flex; }
    @media (min-width: 600px) { .modal { align-items: center; padding: 20px; } }
    .modal-content { background: #1a1a1a; border-top: 3px solid #F1C40F; border-radius: 20px 20px 0 0; padding: 25px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
    @media (min-width: 600px) { .modal-content { border-radius: 16px; } }
    .modal-title { color: #F1C40F; font-size: 20px; margin-bottom: 15px; text-align: center; font-weight: bold; }
    .modifier-option { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border-radius: 8px; }
    .modifier-option label { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
    .modifier-option input[type="checkbox"] { width: 20px; height: 20px; accent-color: #F1C40F; }
    .qty-selector { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
    .qty-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #F1C40F; color: #4A235A; font-size: 22px; font-weight: bold; cursor: pointer; }
    .qty-value { font-size: 24px; font-weight: bold; min-width: 40px; text-align: center; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #333; color: #fff; }
    .btn-confirm { background: #F1C40F; color: #4A235A; }
    .btn-confirm:disabled { background: #555; color: #888; cursor: not-allowed; }
    .empty-msg { text-align: center; color: #888; padding: 40px 20px; }
    .loading-spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #F1C40F; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 2000; transition: transform 0.3s; border-right: 4px solid #F1C40F; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-right-color: #E74C3C; }
    .toast.success { border-right-color: #2ECC71; }
</style>
</head>
<body>

<div class="header">
    <h1> Gustavo Sweet & more</h1>
    <p>We are the happiness</p>
</div>

<div class="table-info">
    <span id="tableInfoText">جاري التحميل...</span>
    <span id="connectionStatus" class="connection-status">متصل</span>
</div>

<div id="loadingSpinner" class="loading-spinner"></div>
<div id="menuContainer"></div>

<div class="cart-bar" id="cartBar">
    <div class="cart-content">
        <div class="cart-total" id="cartTotal">0,00 DA</div>
        <button class="cart-btn" onclick="showCart()"> عرض الطلب (<span id="cartCount">0</span>)</button>
    </div>
</div>

<div class="modal" id="itemModal">
    <div class="modal-content">
        <h3 class="modal-title" id="modalTitle">تخصيص الطلب</h3>
        <div id="modalBody"></div>
        <div class="qty-selector">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-value" id="modalQty">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
            <button class="btn-confirm" onclick="addToCart()">إضافة للسلة</button>
        </div>
    </div>
</div>

<div class="modal" id="cartModal">
    <div class="modal-content">
        <h3 class="modal-title">🛒 ملخص طلبك</h3>
        <div id="cartItems"></div>
        <div style="margin-top: 20px; padding-top: 15px; border-top: 2px solid #404040;">
            <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; color: #F1C40F;">
                <span>المجموع:</span>
                <span id="cartTotalModal">0,00 DA</span>
            </div>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
            <button class="btn-cancel" onclick="closeCart()">تعديل</button>
            <button class="btn-confirm" id="sendOrderBtn" onclick="sendOrder()"> إرسال الطلب</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://uvwjhciczohvufllgmac.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hYoya1WlpuWhoLN7QsRyLA_XUmrxHvy';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const urlParams = new URLSearchParams(window.location.search);
const zone = urlParams.get('zone') || 'salle';
const table = urlParams.get('table') || '1';

let menuData = { categories: [], menu: [] };
let cart = [];
let currentItem = null;
let currentQty = 1;
let currentExtras = [];
let isSending = false;

function formatMoney(n) {
    return Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' DA';
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
}

function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast show ${type}`;
    setTimeout(() => toast.classList.remove('show'), 3000);
}

async function loadData() {
    try {
        const { data, error } = await supabase.from('pos_data').select('data').eq('id', 'main').single();
        
        if (error || !data) {
            const localState = localStorage.getItem('gustavo_pos_v3');
            if (localState) {
                menuData = JSON.parse(localState);
                document.getElementById('connectionStatus').classList.add('offline');
                document.getElementById('connectionStatus').textContent = 'وضع محلي';
                showToast('⚠️ البيانات المحلية', 'error');
            } else {
                throw new Error('No data found');
            }
        } else {
            menuData = data.data;
            document.getElementById('connectionStatus').classList.remove('offline');
            document.getElementById('connectionStatus').textContent = 'متصل بالسحابة';
        }
    } catch (error) {
        console.error("Error:", error);
        document.getElementById('menuContainer').innerHTML = '<div class="empty-msg">⚠️ تعذر تحميل المنيو</div>';
    }
    
    document.getElementById('loadingSpinner').style.display = 'none';
    renderMenu();
}

function renderMenu() {
    const zoneLabel = zone === 'salle' ? 'SALLE' : zone === 'terrasse' ? 'TERRASSE' : 'TAKEAWAY';
    document.getElementById('tableInfoText').innerHTML = ` ${zoneLabel} | 🪑 الطاولة: ${table}`;

    const categories = menuData.categories || [];
    const menu = (menuData.menu || []).filter(m => m.available);

    let html = '';
    categories.forEach(cat => {
        const catItems = menu.filter(m => m.categoryKey === cat.key);
        if (catItems.length === 0) return;

        html += `<div class="category-section"><div class="category-title">${cat.emoji || '🍽️'} ${cat.label}</div><div class="menu-grid">`;
        catItems.forEach(item => {
            html += `
                <div class="menu-item" onclick="openItem('${item.id}')">
                    ${item.imageUrl ? `<img class="item-img" src="${escapeHtml(item.imageUrl)}" loading="lazy">` : '<div class="item-img-placeholder">️</div>'}
                    <div class="item-details">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-price">${item.price} DA</div>
                        ${item.extras && item.extras.length > 0 ? `<div class="item-extras">${item.extras.slice(0,2).map(e => `<span class="extra-tag">+${e.name}</span>`).join('')}</div>` : ''}
                    </div>
                </div>`;
        });
        html += '</div></div>';
    });

    document.getElementById('menuContainer').innerHTML = html || '<div class="empty-msg">لا توجد منتجات</div>';
}

function openItem(id) {
    const item = menuData.menu.find(m => m.id === id);
    if (!item) return;

    currentItem = item;
    currentQty = 1;
    currentExtras = [];

    document.getElementById('modalTitle').innerText = item.name;
    
    let body = '';
    if (item.extras && item.extras.length > 0) {
        body = '<div style="margin: 15px 0;">';
        item.extras.forEach((extra, idx) => {
            body += `
                <div class="modifier-option">
                    <label><input type="checkbox" data-idx="${idx}" onchange="toggleExtra(this, ${idx})"><span>${escapeHtml(extra.name)}</span></label>
                    <span style="color: #F1C40F;">+${extra.price} DA</span>
                </div>`;
        });
        body += '</div>';
    } else {
        body = '<p style="text-align: center; color: #888; padding: 20px;">لا توجد إضافات</p>';
    }

    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalQty').innerText = '1';
    document.getElementById('itemModal').classList.add('show');
}

function toggleExtra(checkbox, idx) {
    const extra = currentItem.extras[idx];
    if (checkbox.checked) {
        currentExtras.push(extra);
    } else {
        currentExtras = currentExtras.filter(e => e.name !== extra.name);
    }
}

function changeQty(delta) {
    currentQty = Math.max(1, Math.min(20, currentQty + delta));
    document.getElementById('modalQty').innerText = currentQty;
}

function closeModal() {
    document.getElementById('itemModal').classList.remove('show');
    currentItem = null;
}

function addToCart() {
    if (!currentItem) return;

    const extrasTotal = currentExtras.reduce((sum, e) => sum + e.price, 0);
    const unitPrice = currentItem.price + extrasTotal;
    const extrasNames = currentExtras.map(e => e.name).sort().join(',');
    
    const existing = cart.find(item => item.id === currentItem.id && item.extrasNames === extrasNames);

    if (existing) {
        existing.qty += currentQty;
    } else {
        cart.push({
            id: currentItem.id,
            name: currentItem.name,
            price: currentItem.price,
            extras: currentExtras,
            extrasNames: extrasNames,
            unitPrice: unitPrice,
            qty: currentQty
        });
    }

    closeModal();
    updateCart();
    showToast('✅ تمت الإضافة', 'success');
}

function updateCart() {
    const total = cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);
    const count = cart.reduce((sum, item) => sum + item.qty, 0);

    document.getElementById('cartTotal').innerText = formatMoney(total);
    document.getElementById('cartCount').innerText = count;

    if (cart.length > 0) {
        document.getElementById('cartBar').classList.add('show');
    } else {
        document.getElementById('cartBar').classList.remove('show');
    }
}

function showCart() {
    let html = '';
    cart.forEach((item, idx) => {
        const extrasText = item.extras.length > 0 ? `<br><small style="color: #aaa;">+ ${item.extras.map(e => e.name).join(', ')}</small>` : '';
        html += `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border-radius: 8px;">
                <div style="flex: 1;">
                    <div style="font-weight: bold;">${escapeHtml(item.name)} x${item.qty}</div>
                    ${extrasText}
                </div>
                <div style="color: #F1C40F; font-weight: bold;">${formatMoney(item.unitPrice * item.qty)}</div>
                <button onclick="removeFromCart(${idx})" style="background: rgba(231,76,60,0.2); color: #E74C3C; border: none; width: 28px; height: 28px; border-radius: 6px; margin-right: 10px; cursor: pointer;">✕</button>
            </div>`;
    });

    document.getElementById('cartItems').innerHTML = html;
    document.getElementById('cartTotalModal').innerText = formatMoney(cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0));
    document.getElementById('cartModal').classList.add('show');
}

function removeFromCart(idx) {
    cart.splice(idx, 1);
    showCart();
    updateCart();
}

function closeCart() {
    document.getElementById('cartModal').classList.remove('show');
}

async function sendOrder() {
    if (cart.length === 0 || isSending) return;
    
    isSending = true;
    const btn = document.getElementById('sendOrderBtn');
    btn.innerText = '⏳ جاري الإرسال...';
    btn.disabled = true;

    try {
        const total = cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);
        
        const orderData = {
            zone: zone,
            table: table,
            order_details: {
                items: cart.map(item => ({
                    name: item.name,
                    qty: item.qty,
                    unitPrice: item.unitPrice,
                    extras: item.extras.map(e => e.name)
                })),
                total: total
            },
            status: 'pending',
            created_at: new Date().toISOString()
        };

        const { error } = await supabase.from('orders').insert([orderData]);
        if (error) throw error;

        showToast('🚀 تم إرسال طلبك بنجاح!', 'success');
        cart = [];
        updateCart();
        closeCart();

    } catch (error) {
        console.error("Error:", error);
        showToast('⚠️ جاري التحويل لواتساب...', 'error');
        sendViaWhatsApp();
    } finally {
        isSending = false;
        btn.innerText = ' إرسال الطلب';
        btn.disabled = false;
    }
}

function sendViaWhatsApp() {
    let msg = `📋 *طلب جديد*\n\n📍 ${zone.toUpperCase()} | 🪑 الطاولة: ${table}\n\n`;
    cart.forEach((item, idx) => {
        msg += `${idx + 1}. ${item.name} x${item.qty} - ${formatMoney(item.unitPrice * item.qty)}\n`;
    });
    msg += `\n💰 *المجموع: ${formatMoney(cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0))}*`;

    const kitchenPhone = '213781006798';
    window.open(`https://wa.me/${kitchenPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    cart = [];
    updateCart();
    closeCart();
}

document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('show');
    });
});

window.addEventListener('online', () => {
    document.getElementById('connectionStatus').classList.remove('offline');
    document.getElementById('connectionStatus').textContent = 'متصل';
    loadData();
});

window.addEventListener('offline', () => {
    document.getElementById('connectionStatus').classList.add('offline');
    document.getElementById('connectionStatus').textContent = 'غير متصل';
});

loadData();
</script>
</body>
</html>
